<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BPL + g9</title>
  <link rel="icon" href="./image.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    {"imports": {
      "basedpl/": "https://cdn.jsdelivr.net/npm/basedpl@0.1.90/",
      "g9": "https://cdn.jsdelivr.net/npm/g9@1.0.16/+esm"
    }}
  </script>
</head>
<body>
  <header>
    <div><h1>BPL <span>+ g9</span></h1><p>Draw the relationship. Drag the result.</p></div>
    <div class="header-links"><a href="./about.html">About</a><a href="https://omrelli.ug/g9/gallery/" target="_blank" rel="noreferrer">Original js gallery ↗</a></div>
  </header>
  <main>
    <nav id="examples" aria-label="Examples"></nav>
    <section class="workspace">
      <div class="heading"><div><h2 id="title">Loading…</h2><p id="description"></p></div><span id="status" role="status">Loading BPL</span></div>
      <div id="stage" aria-label="Interactive drawing"></div>
      <p class="hint">Drag the shapes. The model's parameters change to keep the drawing consistent. <button id="play" type="button" hidden>Play</button></p>
      <div class="editor-heading"><h3>BPL model</h3><div><button id="reset" type="button">Reset</button><button id="run" type="button">Run changes</button></div></div>
      <div id="bpl-toolbar"></div>
      <label class="sr-only" for="source">BPL model source</label>
      <textarea id="source" data-bpl spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <details><summary>Current parameters</summary><pre id="state"></pre></details>
      <pre id="error" role="alert" hidden></pre>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
